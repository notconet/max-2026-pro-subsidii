# The template configuration without SSL TLS
# - In production, use Let's Encrypt's certbot,
#   or other certification method

server {
    listen 80;
    server_name pro-subsidii.ru www.pro-subsidii.ru;

    root /var/www/pro-subsidii.ru;

    # Never cache index.html — it's the version pointer
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Hashed assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: deny access to dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    server_name api.pro-subsidii.ru;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
